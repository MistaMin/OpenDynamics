[package]
name = "opendynamics"
description = "OpenDynamics: gate/expander, compressor, de-expander, decompressor and limiter on OpenPluginSDK with GoodLookin DRI"
version = "1.0.0-beta"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
olm-api = { path = "crates/api" }
dynamics = { path = "crates/dynamics" }
dyn-deexpand = { path = "crates/dyn-deexpand" }
dyn-decompress = { path = "crates/dyn-decompress" }
# OpenPluginSDK main (19fac89) in ../../Dependencies, the same layout on the owner's Mac and in
# GitHub Actions (pinned in scripts/build.sh and the CI workflow).
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin" }
# Text measuring for the kit: the GoodLookin DRI in the SDK's tree, the same crate the SDK uses.
goodlookindri-shell = { path = "../../Dependencies/OpenPluginSDK/crates/goodlookindri/shell" }

[workspace]
members = ["crates/*"]

[profile.release]
opt-level = 3
lto = "thin"
