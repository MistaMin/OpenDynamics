# Windows and Linux builds of OpenDynamics. macOS is built on the owner's Mac (scripts/build.sh).
# Each job builds the same commit, runs the tests and keeps the installer (Windows) or archive (Linux)
# with its SHA-256 as an artifact.
name: Windows and Linux builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # The revisions this build is made and tested with (as in scripts/build.sh).
  OPENPLUGIN_SDK_REF: ce6454f94f3c885764e2263522681709b173e3cf
  # Celemony's ARA SDK (Apache 2.0): ARA 2 in the VST3, and its TestHost for the ARA test step.
  ARA_SDK_REF: releases/2.3.0
  VST3_SDK_REF: v3.8.1_build_84
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 (VST3, CLAP, LV2)
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      # Cargo.toml finds the SDK (with GoodLookin DRI in its tree) at ../../Dependencies.
      - uses: actions/checkout@v4
        with:
          path: w/opendynamics
      - uses: actions/checkout@v4
        with:
          repository: MistaMin/OpenPluginSDK
          ref: ${{ env.OPENPLUGIN_SDK_REF }}
          path: Dependencies/OpenPluginSDK
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: Dependencies/vst3sdk
      - uses: actions/checkout@v4
        with:
          repository: Celemony/ARA_SDK
          ref: ${{ env.ARA_SDK_REF }}
          submodules: recursive
          path: Dependencies/ARA_SDK
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        working-directory: w/opendynamics
        run: cargo test --release --workspace
      # UIAutomationCore.DLL is the Windows accessibility library the editor's window uses.
      - name: Build VST3, CLAP and LV2
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $version = (Select-String -Path w\opendynamics\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          # Bundle versions are numbers only; the plugin itself reports the full version.
          $version = $version.Split('-')[0]
          powershell -NoProfile -ExecutionPolicy Bypass -File Dependencies\OpenPluginSDK\scripts\windows\build_plugin.ps1 `
            -ManifestPath w\opendynamics\Cargo.toml -Name OpenDynamics -Version $version -Manufacturer OpenGrid `
            -BundleId com.opengrid.opendynamics -Editor -AllowLib UIAutomationCore.DLL -TtlBin lv2_ttl -Formats clap,vst3,lv2 `
            -Vst3Sdk "$root\Dependencies\vst3sdk" -AraSdk "$root\Dependencies\ARA_SDK" -Out "$root\dist-windows" -WorkDir "$root\build-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ARA test (ARA SDK TestHost)
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          cmake -S Dependencies\ARA_SDK\ARA_Examples -B build-ara -A x64 "-DARA_VST3_SDK_DIR=$root\Dependencies\vst3sdk" -DARA_SETUP_DEBUGGING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-ara --config Debug --target ARATestHost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python w\opendynamics\tools\make_ara_clip.py clip.wav
          $host_exe = Get-ChildItem -Recurse build-ara -Filter ARATestHost.exe | Select-Object -First 1
          # A failed check in a Debug build can open an error box nobody clicks on a CI machine: the
          # run is limited to 15 minutes and stopped after, and the log shows how far it got.
          $p = Start-Process -FilePath $host_exe.FullName -ArgumentList @('-vst3', "$root\dist-windows\OpenDynamics.vst3\Contents\x86_64-win\OpenDynamics.vst3", '-file', 'clip.wav') `
            -RedirectStandardOutput testhost.out -RedirectStandardError testhost.log -NoNewWindow -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host 'TestHost did not finish in 15 minutes' }
          Get-Content testhost.out, testhost.log | Select-Object -Last 60
          $code = if ($p.HasExited) { $p.ExitCode } else { -1 }
          $tests = (Select-String -Path testhost.log -Pattern '\*\*\* testing').Count
          $violations = (Select-String -Path testhost.log -Pattern 'ARA API violation|ARA_ASSERT').Count
          Write-Host "TestHost exit $code, $tests test cases, $violations violations"
          if ($code -ne 0 -or $tests -lt 12 -or $violations -ne 0) { exit 1 }
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path w\opendynamics\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $v = $v -replace '-beta$','-Beta'
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress; $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          iscc /DVersion=$v /DDist="$env:GITHUB_WORKSPACE\dist-windows" /DRoot="$env:GITHUB_WORKSPACE\w\opendynamics" w\opendynamics\installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # One line with a Unix line ending, so `shasum -a 256 -c` reads it on macOS and Linux.
          Get-FileHash -Algorithm SHA256 OpenDynamics-*-setup.exe | ForEach-Object { [IO.File]::WriteAllText("$PWD\$(Split-Path $_.Path -Leaf).sha256", "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)`n") }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            OpenDynamics-*-windows-x64-setup.exe
            OpenDynamics-*-windows-x64-setup.exe.sha256

  linux:
    name: Linux x86_64 (VST3, CLAP, LV2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: w/opendynamics
      - uses: actions/checkout@v4
        with:
          repository: MistaMin/OpenPluginSDK
          ref: ${{ env.OPENPLUGIN_SDK_REF }}
          path: Dependencies/OpenPluginSDK
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: Dependencies/vst3sdk
      - uses: actions/checkout@v4
        with:
          repository: Celemony/ARA_SDK
          ref: ${{ env.ARA_SDK_REF }}
          submodules: recursive
          path: Dependencies/ARA_SDK
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        working-directory: w/opendynamics
        run: cargo test --release --workspace
      - name: Build VST3, CLAP and LV2
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' w/opendynamics/Cargo.toml | head -1)
          version="${version%%-*}"  # bundle versions are numbers only
          Dependencies/OpenPluginSDK/scripts/build_plugin_linux.sh --manifest-path w/opendynamics/Cargo.toml \
            --name OpenDynamics --version "$version" --ttl-bin lv2_ttl --formats clap,lv2,vst3 --editor \
            --vst3-sdk "$GITHUB_WORKSPACE/Dependencies/vst3sdk" --ara-sdk "$GITHUB_WORKSPACE/Dependencies/ARA_SDK" --strip \
            --out "$GITHUB_WORKSPACE/dist-linux" --work-dir "$GITHUB_WORKSPACE/build-linux"
      - name: ARA test (ARA SDK TestHost)
        run: |
          # ARA_Library/Debug/ARAContentLogger.h uses std::numeric_limits without <limits>; GCC needs it.
          cmake -S Dependencies/ARA_SDK/ARA_Examples -B build-ara -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-include limits" \
            -DARA_VST3_SDK_DIR="$GITHUB_WORKSPACE/Dependencies/vst3sdk" -DARA_SETUP_DEBUGGING=OFF
          cmake --build build-ara --target ARATestHost -j 4
          python3 w/opendynamics/tools/make_ara_clip.py clip.wav
          host=$(find build-ara -type f -name ARATestHost -perm -u+x | head -1)
          set +e
          # On Windows and Linux TestHost loads the module file inside the bundle.
          "$host" -vst3 "$GITHUB_WORKSPACE/dist-linux/OpenDynamics.vst3/Contents/x86_64-linux/OpenDynamics.so" -file clip.wav > testhost.log 2>&1
          code=$?
          set -e
          tests=$(grep -c '\*\*\* testing' testhost.log || true)
          violations=$(grep -c 'ARA API violation\|ARA_ASSERT' testhost.log || true)
          tail -40 testhost.log
          echo "TestHost exit $code, $tests test cases, $violations violations"
          [ "$code" = 0 ] && [ "$tests" -ge 12 ] && [ "$violations" = 0 ]
      - name: Archive
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' w/opendynamics/Cargo.toml | head -1 | sed 's/-beta$/-Beta/')
          name="OpenDynamics-$v-linux-x86_64"
          mkdir -p pkg/usr/lib/vst3 pkg/usr/lib/clap pkg/usr/lib/lv2 pkg/usr/share/doc/opendynamics
          cp -R dist-linux/OpenDynamics.vst3 pkg/usr/lib/vst3/
          cp dist-linux/OpenDynamics.clap pkg/usr/lib/clap/
          cp -R dist-linux/OpenDynamics.lv2 pkg/usr/lib/lv2/
          cp w/opendynamics/LICENSE w/opendynamics/BINARY_LICENSE.txt w/opendynamics/THIRD_PARTY_LICENSES.md w/opendynamics/Licenses/* pkg/usr/share/doc/opendynamics/
          tar -C pkg --owner=0 --group=0 -czf "$name.tar.gz" usr
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          tar -tzf "$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            OpenDynamics-*-linux-x86_64.tar.gz
            OpenDynamics-*-linux-x86_64.tar.gz.sha256
